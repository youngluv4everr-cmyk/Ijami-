<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Love Letters ❤️</title>  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial, sans-serif;
    }

    body {
    background: linear-gradient(135deg, #ffdde1, #ee9ca7);
    color: #4a1f2d;
    }

    .box{
      width:100%;
      max-width:500px;
      background:white;
      padding:30px;
      border-radius:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,.2);
    }

    h1{
      color:#ff3f73;
      margin-bottom:15px;
    }

    input, textarea{
      width:100%;
      padding:14px;
      margin:10px 0;
      border:1px solid #ddd;
      border-radius:12px;
      font-size:16px;
    }

    textarea{
      height:130px;
      resize:none;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#ff3f73;
      color:white;
      font-size:16px;
      cursor:pointer;
      margin-top:5px;
    }

    button:hover{
      opacity:.9;
    }

    #app{
      display:none;
    }

    .letter{
      margin-top:15px;
      padding:15px;
      text-align:left;
      background:#fff0f4;
      border-radius:15px;
      word-wrap:break-word;
    }

    .time{
      font-size:12px;
      color:#777;
      margin-top:8px;
    }
  </style></head><body>  <!-- PASSWORD PAGE -->  <div class="box" id="loginBox">
    <h1>Ijami private💌😌!</h1><p>Enter our secret password 🥺❤️</p>

<input
  type="password"
  id="password"
  placeholder="Enter Password"
>

<button onclick="checkPassword()">Open My Love ❤️</button>

  </div>  <!-- LOVE LETTER PAGE -->  <div class="box" id="app"><h1>Our Love Letters ❤️</h1>

<textarea
  id="message"
  placeholder="Write your love letter here... ❤️"
></textarea>

<button id="sendBtn">Send Love Letter 💌</button>

<div id="letters"></div>

  </div>  <script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      onValue
    } from
    "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    // 🔥 FIREBASE CONFIG
    // IMPORTANT:
    // Paste your FULL Firebase config here.

    const firebaseConfig = {

      apiKey: "PASTE_YOUR_API_KEY_HERE",

      authDomain: "youngluv4everr-d0b36.firebaseapp.com",

      databaseURL:
      "https://youngluv4everr-d0b36-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId: "youngluv4everr-d0b36",

      storageBucket:
      "youngluv4everr-d0b36.firebasestorage.app",

      messagingSenderId:
      "PASTE_YOUR_SENDER_ID",

      appId:
      "PASTE_YOUR_APP_ID"

    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(app);


    // 💌 SEND LETTER

    document.getElementById("sendBtn")
    .addEventListener("click", async () => {

      const message =
      document.getElementById("message").value.trim();

      if(message === ""){
        alert("First write something for your love ❤️");
        return;
      }


      const lettersRef = ref(db, "loveLetters");

      const newLetterRef = push(lettersRef);


      await set(newLetterRef, {

        message: message,

        time: new Date().toLocaleString()

      });


      document.getElementById("message").value = "";

    });



    // ❤️ SHOW LETTERS

    const lettersRef = ref(db, "loveLetters");


    onValue(lettersRef, (snapshot) => {

      const data = snapshot.val();

      const lettersDiv =
      document.getElementById("letters");

      lettersDiv.innerHTML = "";


      if(!data) return;


      Object.values(data)
      .reverse()
      .forEach(letter => {

        const div =
        document.createElement("div");

        div.className = "letter";

        div.innerHTML = `
          <div>${letter.message}</div>
          <div class="time">${letter.time}</div>
        `;

        lettersDiv.appendChild(div);

      });

    });


    // 🔐 PASSWORD

    window.checkPassword = function(){

      const password =
      document.getElementById("password").value;


      // CHANGE YOUR PASSWORD HERE ❤️

      if(password === "Ijunasi123"){

        document.getElementById("loginBox")
        .style.display = "none";

        document.getElementById("app")
        .style.display = "block";

      }

      else{

        alert("Wrong password 🥺❤️");

      }

    };

  </script></body>
</html>
